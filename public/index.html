<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Assistant Debug Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">
    <div id="app" class="w-full max-w-7xl">
      <div class="bg-white rounded-xl shadow-lg h-[80vh] flex flex-col">
        <div class="p-5 border-b border-gray-200">
          <h1 class="text-xl font-semibold text-gray-800">
            Voice Assistant Debug Chat
          </h1>
        </div>
        <div
          class="flex-1 p-5 overflow-y-auto space-y-4"
          ref="messagesContainer"
        >
          <div
            v-for="msg in messages"
            :key="msg.id"
            :class="[
              'max-w-[80%] px-4 py-3 rounded-lg',
              msg.isUser 
                ? 'bg-blue-500 text-white ml-auto' 
                : 'bg-gray-200 text-gray-800'
            ]"
          >
            {{ msg.text }}
          </div>
        </div>
        <div class="p-5 border-t border-gray-200 flex gap-3">
          <input
            v-model="inputMessage"
            @keypress.enter="sendMessage"
            :disabled="loading"
            type="text"
            placeholder="Type your message..."
            class="flex-1 px-4 py-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
            ref="inputField"
          />
          <button
            @click="sendMessage"
            :disabled="loading || !inputMessage.trim()"
            class="px-6 py-3 bg-blue-500 text-white rounded-lg text-sm font-medium hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
          >
            {{ loading ? "Sending..." : "Send" }}
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            messages: [],
            inputMessage: "",
            loading: false,
            messageId: 0,
          };
        },
        methods: {
          async sendMessage() {
            if (!this.inputMessage.trim() || this.loading) return;

            const message = this.inputMessage.trim();
            this.messages.push({
              id: this.messageId++,
              text: message,
              isUser: true,
            });
            this.inputMessage = "";
            this.loading = true;

            this.$nextTick(() => this.scrollToBottom());

            try {
              const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message }),
              });

              const data = await response.json();

              this.messages.push({
                id: this.messageId++,
                text: response.ok ? data.message : `Error: ${data.error}`,
                isUser: false,
              });
            } catch (error) {
              this.messages.push({
                id: this.messageId++,
                text: `Error: ${error.message}`,
                isUser: false,
              });
            } finally {
              this.loading = false;
              this.$nextTick(() => {
                this.scrollToBottom();
                this.$refs.inputField.focus();
              });
            }
          },
          scrollToBottom() {
            const container = this.$refs.messagesContainer;
            container.scrollTop = container.scrollHeight;
          },
        },
        mounted() {
          this.$refs.inputField.focus();
        },
      }).mount("#app");
    </script>
  </body>
</html>
